<div class="oj-hybrid-padding">
  <h1>Dashboard Content Area</h1>
  <div>
      <div class="demo-list-container">
          <oj-list-view
                  id="listview"
                  aria-label="Card list view"
                  data="[[dataProvider]]"
                  display="card"
                  scroll-policy="loadMoreOnScroll"
                  scroll-policy-options.fetch-size="10"
                  scroll-policy-options.scroll-debounce-threshold="50"
                  class="demo-list">

              <template slot="itemTemplate" data-oj-as="item">
                  <li class="demo-card">
                      <oj-action-card>

                          <div class="card-img-wrapper">
                          <img data-bind="attr: { src: item.data.thumbnails[0].imageBase64 }"
                               alt="Profile image"
                               class="profile-img" />

                          <div class="card-btn-overlay" data-bind="visible: !store.cartSkuSet()[item.data.sku]">
                              <oj-button on-oj-action="[[() => store.addToCart(item.data)]]">
                                  Agregar
                              </oj-button>
                          </div>

                          <div class="card-btn-overlay" data-bind="visible: !!store.cartSkuSet()[item.data.sku]">

                              <oj-button on-oj-action="[[() => store.removeFromCart(item.data)]]">
                                  -
                              </oj-button>

                              <span class="oj-badge" data-bind="text: store.cartQtyMap()[item.data.sku]"></span>

                              <oj-button on-oj-action="[[() => store.addToCart(item.data)]]">
                                  +
                              </oj-button>

                          </div>
                          </div>

                          <div class="card-content">
                              <div class="price">
                                  <oj-bind-text value="[[formatCLP(item.data.prices[0].total)]]"></oj-bind-text>
                              </div>

                              <div class="name">
                                  <oj-bind-text value="[[item.data.name]]"></oj-bind-text>
                              </div>
                          </div>

                      </oj-action-card>
                  </li>
              </template>

          </oj-list-view>
      </div>
  </div>
    <div data-bind="ojModule: {
    name: 'cart',
    params: {
    store: store
    }}"></div>
</div>
